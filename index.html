<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VMEC-11 UI v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: danh sách màn hình bên trái, màn hình thật được thu phóng vừa khung bên phải. Token đặt trùng tên biến Figma (Primitives / Semantic / Layout). */
:root{
  color-scheme:light;
  --font-ui:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --color-bg-page:#F2F5F5; --color-bg-surface:#FFFFFF; --color-bg-subtle:#E4ECEC; --color-bg-inverse:#132120;
  --color-border-default:#D3DEDE; --color-border-subtle:#E4ECEC; --color-border-strong:#B6C5C5;
  --color-text-primary:#132120; --color-text-secondary:#55696A; --color-text-inverse:#FFFFFF; --color-text-brand:#0A676B; --color-text-disabled:#7A8C8D;
  --color-action-primary:#0A676B; --color-action-primary-hover:#07504F; --color-action-primary-subtle:#DCEEEE; --color-action-primary-border:#B7DCDC; --color-action-on-primary:#FFFFFF; --color-focus-ring:#1C8A8F;
  --status-low-bg:#DBF2E3; --status-low-fg:#106B37; --status-low-border:#9ED2B2;
  --status-medium-bg:#FFEDBF; --status-medium-fg:#734D00; --status-medium-border:#E8C46A;
  --status-high-bg:#B0320A; --status-high-fg:#FFFFFF; --status-high-border:#B0320A; --status-high-subtle-bg:#FFE2D4; --status-high-subtle-fg:#8A2606;
  --status-unknown-bg:#EBE6F7; --status-unknown-fg:#57478C; --status-unknown-border:#C5BBE6;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px;
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-full:999px;
  --shadow-card:0 1px 3px rgba(19,33,32,.06); --shadow-raised:0 4px 12px rgba(19,33,32,.16);
  --shell-bg:#E3EAEA;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font-ui);background:var(--shell-bg);color:var(--color-text-primary);display:flex;font-size:14px;line-height:20px}
button{font-family:inherit}

/* ===== Vỏ xem ===== */
#index{width:292px;flex:none;background:var(--color-bg-surface);border-right:1px solid var(--color-border-default);overflow-y:auto;padding:20px 16px 24px;display:flex;flex-direction:column;gap:4px}
#index h1{font:700 18px/24px var(--font-ui);margin:0}
#index .lead{color:var(--color-text-secondary);font-size:13px;line-height:18px;margin:4px 0 12px}
#index h2{font:600 11px/16px var(--font-ui);letter-spacing:.04em;text-transform:uppercase;color:var(--color-text-secondary);margin:16px 0 4px}
#index a{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;color:var(--color-text-primary);text-decoration:none;font-size:13px;line-height:18px}
#index a b{font:600 12px/18px var(--font-ui);color:var(--color-text-brand);min-width:26px}
#index a:hover{background:var(--color-bg-page)}
#index a.on{background:var(--color-action-primary-subtle);color:var(--color-text-brand);font-weight:600}
#index a:focus-visible{outline:2px solid var(--color-focus-ring);outline-offset:1px}
#stage{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px;overflow:hidden}
#holder{position:relative;flex:none}
#frame{position:absolute;left:0;top:0;transform-origin:top left}
#cap{max-width:900px;text-align:center;color:var(--color-text-secondary);font-size:13px;line-height:18px}
#cap strong{color:var(--color-text-primary)}
#hint{position:fixed;right:16px;bottom:12px;background:var(--color-bg-inverse);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;line-height:16px;opacity:.9}
@media (max-width:900px){body{flex-direction:column}#index{width:100%;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:10px 12px;gap:6px;border-right:0;border-bottom:1px solid var(--color-border-default);flex:none}#index h1,#index .lead,#index h2{display:none}#index a{white-space:nowrap;border:1px solid var(--color-border-default)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Ứng dụng ===== */
.frame{font-family:var(--font-ui);color:var(--color-text-primary);background:var(--color-bg-page);font-size:14px;line-height:20px;overflow:hidden;box-shadow:0 8px 30px rgba(19,33,32,.14);border:1px solid var(--color-border-strong)}
.frame *{box-sizing:border-box}
.frame.web{width:1440px;height:900px;display:flex;border-radius:10px}
.frame.mobile{width:390px;height:844px;border-radius:32px;display:flex;flex-direction:column;background:var(--color-bg-surface);position:relative}
.ic{flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.frame :focus-visible{outline:2px solid var(--color-focus-ring);outline-offset:2px}
.frame h1,.frame h2,.frame h3,.frame p{margin:0}
.muted{color:var(--color-text-secondary)}
.sm{font-size:13px;line-height:18px}
.cap{font-size:12px;line-height:16px}
.b{font-weight:600}

/* nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:500 14px/20px var(--font-ui);padding:10px 16px;border-radius:var(--radius-md);border:1px solid transparent;cursor:pointer;white-space:nowrap;background:none;color:inherit}
.btn.primary{background:var(--color-action-primary);color:var(--color-action-on-primary)}
.btn.primary:hover{background:var(--color-action-primary-hover)}
.btn.secondary{background:#fff;border-color:var(--color-border-strong);color:var(--color-text-primary)}
.btn.secondary:hover{background:var(--color-bg-page)}
.btn.danger{background:var(--status-high-bg);color:var(--status-high-fg)}
.btn.danger:hover{background:#8F2808}
.btn.ghost{color:var(--color-text-brand)}
.btn.ghost:hover{background:var(--color-action-primary-subtle)}
.btn.lg{padding:16px 24px;font:600 16px/24px var(--font-ui);min-height:56px}
.btn.smb{padding:6px 12px;font-size:13px;line-height:18px}
.btn.full{width:100%}
/* badge */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius-full);font:500 12px/16px var(--font-ui);border:1px solid;white-space:nowrap}
.badge.low{background:var(--status-low-bg);color:var(--status-low-fg);border-color:var(--status-low-border)}
.badge.medium{background:var(--status-medium-bg);color:var(--status-medium-fg);border-color:var(--status-medium-border)}
.badge.high{background:var(--status-high-bg);color:var(--status-high-fg);border-color:var(--status-high-border)}
.badge.highsub{background:var(--status-high-subtle-bg);color:var(--status-high-subtle-fg);border-color:#F2B79E}
.badge.unknown{background:var(--status-unknown-bg);color:var(--status-unknown-fg);border-color:var(--status-unknown-border)}
.badge.neutral{background:var(--color-bg-subtle);color:var(--color-text-secondary);border-color:var(--color-border-default)}
.badge.brand{background:var(--color-action-primary-subtle);color:var(--color-text-brand);border-color:var(--color-action-primary-border)}
/* thẻ, bảng, ô nhập */
.card{background:#fff;border:1px solid var(--color-border-default);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card>h3{font:600 16px/24px var(--font-ui)}
.card.flat{box-shadow:none}
.row{display:flex;align-items:center;gap:8px}
.row.sb{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.grow{flex:1;min-width:0}
.tbl{border:1px solid var(--color-border-default);border-radius:var(--radius-md);overflow:hidden;background:#fff}
.tr{display:grid;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--color-border-subtle);font-size:13px;line-height:18px}
.tr:first-child{border-top:0}
.tr.th{background:var(--color-bg-page);color:var(--color-text-secondary);font-weight:500;font-size:12px;line-height:16px;padding:9px 14px}
.tr.go{cursor:pointer}.tr.go:hover{background:var(--color-bg-page)}
.tr.sel{background:var(--color-action-primary-subtle);box-shadow:inset 3px 0 0 var(--color-action-primary)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>label{font:500 12px/16px var(--font-ui);color:var(--color-text-secondary)}
.inp,.sel{width:100%;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);padding:10px 12px;background:#fff;font:400 14px/20px var(--font-ui);color:var(--color-text-primary);min-height:42px}
textarea.inp{resize:none;min-height:88px;display:block}
.sel{display:flex;align-items:center;justify-content:space-between}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{background:var(--color-bg-page);border:1px dashed var(--color-border-strong);border-radius:var(--radius-md);padding:10px 12px;font-size:13px;line-height:18px;color:var(--color-text-secondary)}
.note.ai{background:var(--color-action-primary-subtle);border-color:var(--color-action-primary-border);border-style:solid;color:var(--color-text-primary)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius-full);border:1px solid var(--color-border-default);background:#fff;color:var(--color-text-secondary);font:400 13px/18px var(--font-ui);cursor:pointer}
.chip.on{background:var(--color-action-primary-subtle);border-color:var(--color-action-primary-border);color:var(--color-text-brand);font-weight:500}
.seg{display:inline-flex;background:var(--color-bg-subtle);border-radius:var(--radius-md);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:6px;font:500 13px/18px var(--font-ui);color:var(--color-text-secondary);cursor:pointer}
.seg button.on{background:#fff;color:var(--color-text-primary);box-shadow:var(--shadow-card)}
.chk{width:24px;height:24px;flex:none;border-radius:var(--radius-sm);border:1.5px solid var(--color-border-strong);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;padding:0}
.chk.on{background:var(--color-action-primary);border-color:var(--color-action-primary)}
.chk svg{display:none}.chk.on svg{display:block}
.pts{font:600 12px/16px var(--font-ui);padding:2px 8px;border-radius:var(--radius-full);white-space:nowrap}
.p0{background:var(--color-bg-subtle);color:var(--color-text-secondary)}
.p1,.p2{background:var(--status-medium-bg);color:var(--status-medium-fg)}
.p3{background:var(--status-high-subtle-bg);color:var(--status-high-subtle-fg)}
.sim{display:flex;align-items:center;gap:8px;background:var(--color-action-primary-subtle);color:var(--color-text-brand);font:500 12px/16px var(--font-ui);padding:6px 24px;letter-spacing:.01em}
.item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--color-border-default);border-radius:var(--radius-md);background:#fff}
.item.go{cursor:pointer}.item.go:hover{background:var(--color-bg-page)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--status-high-bg);flex:none}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--color-action-primary-subtle);color:var(--color-text-brand);display:inline-flex;align-items:center;justify-content:center;font:600 12px/16px var(--font-ui);flex:none}
.big{font:700 32px/40px var(--font-ui)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

/* web shell */
.side{width:232px;flex:none;background:#fff;border-right:1px solid var(--color-border-default);padding:20px 16px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.logo i{width:32px;height:32px;border-radius:8px;background:var(--color-action-primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font:700 16px/16px var(--font-ui);font-style:normal}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-md);color:var(--color-text-secondary);font:500 14px/20px var(--font-ui);cursor:pointer;text-decoration:none;margin-bottom:2px}
.nav a:hover{background:var(--color-bg-page)}
.nav a.active{background:var(--color-action-primary-subtle);color:var(--color-text-brand)}
.nav a.dis{cursor:default}
.userbox{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:16px;border-top:1px solid var(--color-border-subtle)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:20px 28px 16px}
.ph h1{font:700 24px/32px var(--font-ui)}
.ph .acts{display:flex;gap:8px}
.content{flex:1;min-height:0;padding:0 28px 24px;display:flex;flex-direction:column;gap:16px}
.cols{display:flex;gap:16px;min-height:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:14px 16px;gap:2px}
.stat .v{font:700 28px/36px var(--font-ui)}

/* mobile shell */
.statusbar{display:flex;justify-content:space-between;padding:12px 28px 6px;font:600 13px/16px var(--font-ui)}
.mh{display:flex;align-items:center;gap:8px;padding:8px 16px;min-height:52px}
.mh h1{font:700 20px/28px var(--font-ui);flex:1}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--color-bg-page);display:inline-flex;align-items:center;justify-content:center;color:var(--color-text-primary);cursor:pointer;position:relative;padding:0;flex:none}
.iconbtn .dot{position:absolute;top:10px;right:11px;border:2px solid var(--color-bg-page);width:12px;height:12px}
.mbody{flex:1;min-height:0;padding:8px 16px 12px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.tabs{display:flex;justify-content:space-between;padding:8px 20px 22px;border-top:1px solid var(--color-border-default);background:#fff}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;width:80px;padding:4px 0;color:var(--color-text-secondary);font:500 12px/16px var(--font-ui);cursor:pointer;background:none;border:0}
.tab.active{color:var(--color-text-brand)}
.fab{position:absolute;right:20px;bottom:112px;width:64px;height:64px;border-radius:50%;background:var(--color-action-primary);color:#fff;border:0;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-raised);cursor:pointer}
.task{display:flex;align-items:center;gap:12px;padding:12px;min-height:64px;border:1px solid var(--color-border-default);border-radius:var(--radius-lg);background:#fff;box-shadow:var(--shadow-card)}
.metric{flex:1;padding:12px;gap:2px}
.metric .v{font:700 22px/30px var(--font-ui)}
.mic{width:128px;height:128px;border-radius:50%;background:var(--color-action-primary);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 12px var(--color-action-primary-subtle),0 0 0 26px #EAF4F4;margin:20px auto 12px}
.wave{display:flex;align-items:center;justify-content:center;gap:4px;height:48px}
.wave i{width:6px;border-radius:3px;background:var(--color-action-primary);animation:wv 1.1s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.call{background:var(--color-bg-inverse);color:#fff;border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.audio{display:flex;align-items:center;gap:12px}
.audio .bar{flex:1;height:6px;border-radius:3px;background:var(--color-bg-subtle);position:relative}
.audio .bar i{position:absolute;left:0;top:0;bottom:0;width:38%;border-radius:3px;background:var(--color-action-primary)}
.play{width:36px;height:36px;border-radius:50%;background:var(--color-action-primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}

/* trang token */
.tok{padding:32px 36px;width:1100px;background:#fff;border-radius:10px;font-family:var(--font-ui);box-shadow:0 8px 30px rgba(19,33,32,.14);display:flex;flex-direction:column;gap:28px}
.tok h2{font:700 20px/28px var(--font-ui);margin:0 0 12px}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.sw div{border:1px solid var(--color-border-default);border-radius:8px;overflow:hidden;font-size:11px;line-height:15px}
.sw i{display:block;height:44px}
.sw span{display:block;padding:6px 8px;color:var(--color-text-secondary);word-break:break-all}
.sw b{display:block;color:var(--color-text-primary);font-weight:600}
[hidden]{display:none!important}
.tr.on{background:var(--color-action-primary-subtle);box-shadow:inset 3px 0 0 var(--color-action-primary)}
.lnk{color:var(--color-text-brand);text-decoration:underline;cursor:pointer}
.kbd{border:1px solid var(--color-border-strong);border-bottom-width:2px;border-radius:4px;padding:0 6px;font:600 11px/16px var(--font-ui);background:#fff;color:var(--color-text-primary)}
.modal{position:absolute;inset:0;background:rgba(19,33,32,.45);display:flex;align-items:center;justify-content:center;z-index:30}
.dlg{width:540px;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-raised);padding:20px;display:flex;flex-direction:column;gap:14px}
.gw{position:relative;background:#fff;border-radius:var(--radius-md)}
.gh,.inp.gt{font:400 14px/20px var(--font-ui);padding:10px 12px;border:1px solid transparent;white-space:pre-wrap;overflow-wrap:anywhere;min-height:88px}
.gh{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.gh .gv{color:transparent}.gh .gs{color:var(--color-text-disabled)}
.inp.gt{background:transparent;position:relative;border-color:var(--color-border-strong)}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--color-border-default)}
.ptab{padding:10px 16px;border:0;background:none;font:500 14px/20px var(--font-ui);color:var(--color-text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.ptab.on{color:var(--color-text-brand);border-bottom-color:var(--color-action-primary)}
.ptab i{font-style:normal;background:var(--color-bg-subtle);color:var(--color-text-secondary);border-radius:999px;padding:0 7px;font:600 11px/16px var(--font-ui)}
.stepper{display:flex;align-items:center;gap:8px;font:500 13px/18px var(--font-ui);color:var(--color-text-secondary)}
.stepper b{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;background:var(--color-bg-subtle);font:600 12px/16px var(--font-ui)}
.stepper .cur{color:var(--color-text-brand);font-weight:600}.stepper .cur b{background:var(--color-action-primary);color:#fff}
.stepper .done b{background:var(--color-action-primary-subtle);color:var(--color-text-brand)}
.stepper s{width:28px;height:1px;background:var(--color-border-strong);display:inline-block}
.warn{background:var(--status-medium-bg);border:1px solid var(--status-medium-border);color:var(--status-medium-fg);border-radius:var(--radius-md);padding:10px 12px;font-size:13px;line-height:18px;display:flex;gap:8px}
.chg{display:inline-block;margin-top:6px;background:#fff;border:1px solid var(--color-action-primary-border);border-radius:8px;padding:6px 10px;text-align:left;color:var(--color-text-primary)}
.chg b{color:var(--color-text-brand)}
.srch{display:flex;align-items:center;gap:8px;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);padding:0 12px;background:#fff;min-height:42px;color:var(--color-text-secondary);width:320px}
.srch input{border:0;outline:0;font:400 14px/20px var(--font-ui);flex:1;background:none;color:var(--color-text-primary);min-width:0}
.ro{background:var(--color-bg-page);border:1px solid var(--color-border-default);border-radius:var(--radius-md);padding:10px 12px;color:var(--color-text-primary)}
.ib{width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--color-text-secondary);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ib:hover{background:var(--color-bg-subtle)}
.sec-h{font:700 13px/18px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-brand);display:flex;align-items:center;gap:12px}
.sec-h::after{content:'';flex:1;height:1px;background:var(--color-action-primary-border)}
.blk{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--color-border-subtle)}
.blk.first{border-top:0;padding-top:4px}
.blk .bt{font:600 14px/20px var(--font-ui);color:var(--color-text-primary)}
.orow{display:grid;grid-template-columns:190px 1fr 32px;gap:8px;align-items:center}
.orow .nm{font:500 14px/20px var(--font-ui)}
select.inp{appearance:auto;cursor:pointer}
.pr{display:grid;align-items:stretch;border-top:1px solid var(--color-border-subtle);font-size:13px;line-height:18px;cursor:pointer;background:#fff}
.pr:not(.prh):hover .pc:not(.pn){background:var(--color-bg-page)}
.pc{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 8px;gap:4px;min-width:0}
.prh{cursor:default;background:var(--color-bg-page);border-top:0}
.prh .pc{padding:9px 8px;font:500 12px/16px var(--font-ui);color:var(--color-text-secondary)}
.pc.pn b{font:600 14px/20px var(--font-ui)}

<script>
/* ===== Tiện ích tạo HTML ===== */
const I=(n,s=20)=>`<svg class="ic" width="${s}" height="${s}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const bdg=(tone,text,ic)=>`<span class="badge ${tone}">${ic?I(ic,14):''}${text}</span>`;
const lvl=s=>s>=7?['high','Cao','alert-triangle']:s>=5?['medium','Trung bình','alert-circle']:['low','Thấp','check-circle'];
const news=(s,short)=>{const [t,l,ic]=lvl(s);return bdg(t,`NEWS ${s}${short?'':' · '+l}`,ic);};
const unk=()=>bdg('unknown','Chưa đủ dữ liệu','help-circle');
const draft=()=>bdg('neutral','Draft','edit');
const approved=()=>bdg('low','Approved','check-circle');
const rb=s=>s==='Draft'?draft():approved();
const go=(g,t)=>g?` data-go="${g}"${t?` data-tab="${t}"`:''}`:'';
const btn=(label,o={})=>`<button class="btn ${o.v||'secondary'} ${o.lg?'lg':''} ${o.sm?'smb':''} ${o.full?'full':''}"${go(o.go,o.tab)}${o.open?` data-open="${o.open}"`:''}>${o.icon?I(o.icon,o.lg?20:18):''}${label}</button>`;
const fld=(label,val,o={})=>`<div class="fld"${o.style?` style="${o.style}"`:''}><label>${label}</label>${o.select?`<div class="sel"><span>${val}</span>${I('down',18)}</div>`:o.multi?`<textarea class="inp" rows="3">${val}</textarea>`:`<input class="inp" value="${val}">`}</div>`;
const ro=(label,val)=>`<div class="fld"><label>${label}</label><div class="ro">${val}</div></div>`;
const chk=on=>`<button class="chk ${on?'on':''}" data-chk aria-label="Chọn">${I('check',16)}</button>`;
const pts=n=>`<span class="pts p${Math.min(n,3)}">${n} điểm</span>`;
const SIM='DỮ LIỆU MÔ PHỎNG · Công cụ hỗ trợ; nhân viên y tế kiểm tra và quyết định.';
/* ô nhập có chữ gợi ý mờ, bấm Tab để điền */
const ghost=(label,sug,o={})=>`<div class="fld"><label>${label}</label><div class="gw"><div class="gh" aria-hidden="true"><span class="gv"></span><span class="gs">${sug}</span></div><textarea class="inp gt" data-sug="${sug}" rows="${o.rows||3}" placeholder=""></textarea></div><div class="cap muted row" style="gap:6px"><kbd class="kbd">Tab</kbd><span>điền nội dung gợi ý (chữ mờ). Bạn có thể tự viết lý do khác.</span></div></div>`;

function webFrame(o){
  const nav=o.nav.map(([ic,label,g])=>`<a class="${label===o.active?'active':''} ${g?'':'dis'}"${go(g)} tabindex="0">${I(ic,20)}${label}</a>`).join('');
  return `<aside class="side"><div class="logo"><i>V</i><div><div class="b">VMEC-11</div><div class="cap muted">${o.role}</div></div></div><div class="nav">${nav}</div><div class="userbox"><span class="avatar">${o.initials}</span><div><div class="b sm">${o.user}</div><div class="cap muted">${o.userSub}</div></div></div></aside>
  <section class="main">
  <header class="ph"><div><h1>${o.title}</h1><p class="muted sm" style="margin-top:2px">${o.sub||''}</p></div><div class="acts">${o.actions||''}</div></header>
  <div class="content">${o.body}</div></section>${o.modals||''}`;
}
/* v2: bỏ tab Cảnh báo và tab Báo cáo riêng; thêm Bệnh nhân */

function mobFrame(o){

  return `<div class="statusbar"><span>9:41</span><span>●●● 100%</span></div><header class="mh">${o.back?`<button class="iconbtn" aria-label="Quay lại"${go(o.back)}>${I('back',22)}</button>`:''}<h1>${o.title}</h1>${o.right||''}</header>
  <div class="mbody">${o.body}</div>${o.fab||''}${tabs}`;
}
const TABS_ND=[['tasks','Việc','M1'],['users','Bệnh nhân','M7'],['bell','Cảnh báo',''],['handover','Bàn giao','M5']];

/* ===== Dữ liệu mô phỏng (NEWS theo docs/EWS.md: 0–4 thấp, 5–6 trung bình, ≥7 cao) ===== */

const NEWS_P001=vit.reduce((a,v)=>a+v[2],0); // = 8
const PT=[
 {name:'Nguyễn Văn Hòa',bed:'A01',id:'P-001',age:82,news:8,flag:'Nhận thức thay đổi mới',upd:'08:40',due:2,rpt:'Draft'},
 {name:'Trần Thị Lan',bed:'B01',id:'P-005',age:85,news:7,flag:'Nguy cơ ngã',upd:'08:15',due:2,rpt:'Approved'},
 {name:'Lê Quang Minh',bed:'A02',id:'P-002',age:76,news:5,flag:'Cần hỗ trợ vận động',upd:'09:00',due:1,rpt:'Approved'},
 {name:'Hoàng Văn Sáu',bed:'A04',id:'P-004',age:79,news:3,flag:'',upd:'08:30',due:0,rpt:'Approved'},
 {name:'Võ Đình Khôi',bed:'B02',id:'P-006',age:80,news:2,flag:'',upd:'08:20',due:1,rpt:'Approved'},
 {name:'Phạm Thị Hạnh',bed:'A03',id:'P-003',age:88,news:null,flag:'Thiếu nhiệt độ',upd:'07:45',due:1,rpt:'Draft'}];
const nB=p=>p.news==null?unk():news(p.news);
const flagB=p=>p.flag?bdg(p.news==null?'unknown':'brand',p.flag):'<span class="muted">Không có cờ</span>';

/* ----- v2.1: hàng bệnh nhân tô màu theo mức NEWS, công việc có nút tích hoàn thành ----- */
const tone=p=>p.news==null?'unknown':p.news>=7?'high':p.news>=5?'medium':'low';

const P1_TASKS=[
 {id:'TASK-002',t:'Đo lại SpO2 và nhịp thở',due:'Quá hạn 12 phút',st:'over',src:'ORD-014',nw:1},
 {id:'TASK-011',t:'Lấy mẫu khí máu động mạch',due:'09:15',st:'soon',src:'ORD-014',nw:1},
 {id:'TASK-008',t:'Đo lại nhiệt độ',due:'09:30',st:'soon',src:'self'},
 {id:'TASK-010',t:'Truyền NaCl 0,9% 500 ml',due:'09:45',st:'',src:'ORD-014',nw:1},
 {id:'TASK-012',t:'Nằm đầu cao 30°, theo dõi hô hấp',due:'10:00',st:'',src:'ORD-014',nw:1},
 {id:'TASK-009',t:'Cho thuốc A (1 viên uống)',due:'20:00',st:'',src:'ORD-014',nw:1},
 {id:'TASK-013',t:'Lấy mẫu công thức máu',due:'06:00 ngày mai',st:'',src:'ORD-014',nw:1},
 {id:'TASK-007',t:'Đo huyết áp và mạch',due:'08:40',st:'done',src:'self',done:1}];

const W1_TASKS=[
 ['Đo lại SpO2 và nhịp thở','Nguyễn Văn Hòa','Quá hạn 12 phút','over'],
 ['Đo nhiệt độ bổ sung','Phạm Thị Hạnh','Quá hạn 07:45','over'],
 ['Hỗ trợ vận động theo CS-001','Lê Quang Minh','09:00','soon'],

const mCreate=()=>`<div class="modal" id="m-create" hidden><div class="dlg" role="dialog" aria-label="Tạo công việc">
 <div class="row sb"><h3 style="font:600 18px/26px var(--font-ui)">Tạo công việc</h3><button class="ib" data-close aria-label="Đóng">${I('x',18)}</button></div>
 <div class="two">${fld('Bệnh nhân','P-001 · Giường A01',{select:1})}${fld('Người nhận','Điều dưỡng A',{select:1})}</div>
 ${fld('Tên công việc','Đo lại SpO2 và nhịp thở')}
 <div class="two">${fld('Hạn hoàn thành','09:30 · 17/11/2026')}${ro('Nguồn','Tự tạo bởi Điều dưỡng A')}</div>
 ${ghost('Lý do thực hiện công việc',SUG_TASK)}
 <div class="row" style="justify-content:flex-end"><button class="btn secondary" data-close>Hủy</button><button class="btn primary" data-close>Tạo công việc</button></div></div></div>`;

const def=(id,group,name,kind,note,chg,render)=>{S[id]={id,group,name,kind,note,chg,render};};

def('W1','Web · Điều dưỡng','Tổng quan bàn trực','web','Từ flow: ĐD nhận thông báo và theo dõi tổng quan người bệnh. Tách rõ NEWS, cờ chăm sóc và công việc đến hạn.',
 'Danh sách ưu tiên: Bệnh nhân (ô tô màu theo mức NEWS) · Giường · NEWS · Cờ chăm sóc · Cập nhật · Việc hạn, nội dung căn giữa cột. Cột phải: Công việc cần làm (hiện 3 việc, cuộn để xem thêm, có nút tích hoàn thành) và khung Thông báo để trống. Bấm một bệnh nhân mở bệnh án, tab Công việc hiện trước.',
 ()=>ND('Tổng quan',{
 title:'Tổng quan khoa Lão nội trú',sub:'Ca sáng · 07:00–15:00 · 17/11/2026 · 6 người bệnh được phân công',
 actions:btn('Bàn giao ca',{go:'W4'})+btn('Tạo công việc',{icon:'plus',open:'m-create'})+btn('Ghi nhận mới',{v:'primary',icon:'mic',go:'W3'}),
 modals:mCreate(),
 body:`<div class="stats">
  <div class="card stat"><span class="muted sm">Người bệnh trong ca</span><span class="v">6</span></div>

const fmtOrder=d=>{const L=a=>a.length?a.map(r=>`  - ${r[0]}${r[1]?': '+r[1]:''}`).join('\n'):'  (không có)';
 return `Chẩn đoán: ${d.dx||'(chưa nhập)'}\n\nY LỆNH ĐIỀU TRỊ\n* Chăm sóc & Hô hấp: ${d.care||'(không có)'}\n* Thuốc:\n${L(d.thuoc)}\n* Dịch truyền:\n${L(d.dich)}\n* Cận lâm sàng:\n${L(d.cls)}\n* Theo dõi: ${d.follow||'(không có)'}`;};
function readOrder(){
 const g=k=>{const el=frame.querySelector(`[data-k="${k}"]`);return el?el.value.trim():'';};
 const rows=k=>[...frame.querySelectorAll(`[data-list="${k}"] .orow`)].map(r=>[r.dataset.name,r.querySelector('input').value.trim()]);
 return {dx:g('dx'),care:g('care'),follow:g('follow'),thuoc:rows('thuoc'),dich:rows('dich'),cls:rows('cls')};}
const orow=(k,name,note='')=>`<div class="orow" data-name="${name}"><span class="nm">${name}</span><input class="inp" value="${note}" placeholder="${CAT[k].notePh}" aria-label="Ghi chú ${name}"><button class="ib" data-rm aria-label="Xóa ${name}">${I('trash',16)}</button></div>`;
const listBlk=(k,rows,first)=>`<div class="blk ${first?'first':''}"><div class="bt">${CAT[k].title}</div><div class="col" style="gap:8px" data-list="${k}">${rows.map(r=>orow(k,r[0],r[1])).join('')}</div><select class="inp" data-add="${k}" aria-label="Thêm ${CAT[k].title}"><option value="">${CAT[k].ph}</option>${CAT[k].opts.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
const txtBlk=(title,k,val,ph,rows,first)=>`<div class="blk ${first?'first':''}"><label class="bt" for="f-${k}">${title}</label><textarea id="f-${k}" class="inp" rows="${rows||2}" style="min-height:56px" data-k="${k}" placeholder="${ph}">${val}</textarea></div>`;
const taskFromOrder=d=>{const t=[];
 if(d.care)t.push(['Chăm sóc & hô hấp','Điều dưỡng A · theo y lệnh',d.care]);
 d.thuoc.forEach(r=>t.push(['Cho '+r[0],'Điều dưỡng C'+(r[1]?' · '+r[1]:''),r[0]+(r[1]?': '+r[1]:'')]));

 if(d.follow)t.push(['Theo dõi','Điều dưỡng A · theo y lệnh',d.follow]);
 return t;};

const ORDER=Object.keys(S);
const frame=document.getElementById('frame'),holder=document.getElementById('holder'),cap=document.getElementById('cap'),idx=document.getElementById('index');
let cur='W1',pendingTab=null;
function buildIndex(){
  let html='<h1>VMEC-11 · UI v2</h1><p class="lead">Bản đã sửa theo góp ý prototype. Màn có chữ "mới" là màn thêm vào. Bấm nút trong màn để đi theo luồng.</p>';
  let g='';
  for(const id of ORDER){const s=S[id];if(s.group!==g){g=s.group;html+=`<h2>${g}</h2>`;}html+=`<a href="#${id}" data-id="${id}"><b>${id==='T0'?'Aa':id}</b><span>${s.name}</span></a>`;}
  idx.innerHTML=html;
}
function fit(){
  const s=S[cur];const w=s.kind==='web'?1440:s.kind==='mobile'?390:1100;const h=s.kind==='web'?900:s.kind==='mobile'?844:frame.firstElementChild.offsetHeight;
  const st=document.getElementById('stage');const aw=st.clientWidth-40,ah=st.clientHeight-40-cap.offsetHeight-12;
  const k=Math.min(1,aw/w,ah/h);
  frame.style.transform=`scale(${k})`;holder.style.width=(w*k)+'px';holder.style.height=(h*k)+'px';
}
function show(id){
  if(!S[id])id='W1';cur=id;const s=S[id];
  frame.className='frame '+(s.kind==='token'?'':s.kind);
  frame.style.cssText='';
  frame.innerHTML=s.render();
  if(s.kind==='token'){frame.className='';frame.style.boxShadow='none';frame.style.border='0';}
  cap.innerHTML=`<strong>${id==='T0'?'Token':id} · ${s.name}</strong><br>${s.note}<br><span class="chg"><b>Thay đổi v2:</b> ${s.chg}</span>`;
  idx.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.id===id));
  const on=idx.querySelector('a.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'nearest'});
  if(pendingTab){const b=frame.querySelector(`[data-show="pane-${pendingTab}"]`);if(b)b.click();pendingTab=null;}
  fit();
}
function nav(id){if(location.hash!=='#'+id)location.hash=id;else show(id);}
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
window.addEventListener('resize',fit);
const norm=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
function ghostSync(ta){const gh=ta.previousElementSibling;if(!gh)return;const sug=ta.dataset.sug,v=ta.value;gh.querySelector('.gv').textContent=v;gh.querySelector('.gs').textContent=(v===''||sug.startsWith(v))?sug.slice(v.length):'';}
document.addEventListener('input',e=>{
  if(e.target.matches('.gt'))ghostSync(e.target);
  if(e.target.matches('[data-filter]')){const q=norm(e.target.value.trim());frame.querySelectorAll('[data-q]').forEach(r=>{r.hidden=!norm(r.dataset.q).includes(q);});}
});
document.addEventListener('click',e=>{
  if(!frame.contains(e.target))return;
  const c=e.target.closest('[data-chk]');
  if(c){c.classList.toggle('on');const rw=c.closest('[data-task]');if(rw)rw.classList.toggle('done',c.classList.contains('on'));return;}
  const sg=e.target.closest('[data-seg]');
  if(sg){sg.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));sg.classList.add('on');
    const ctl=sg.parentElement.dataset.ctl;if(ctl){const one=sg.dataset.val==='1';const a=frame.querySelector('#'+ctl+'-1'),z=frame.querySelector('#'+ctl+'-0');if(a)a.hidden=!one;if(z)z.hidden=one;}return;}
  const ch=e.target.closest('[data-chip]');
  if(ch){ch.parentElement.querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));ch.classList.add('on');return;}
  const rm=e.target.closest('[data-rm]');
  if(rm){rm.closest('.orow').remove();return;}
  const op=e.target.closest('[data-open]');
  if(op){const m=frame.querySelector('#'+op.dataset.open);if(m)m.hidden=false;return;}
  const cl=e.target.closest('[data-close]');
  if(cl){const m=cl.closest('.modal');if(m)m.hidden=true;return;}
  const sh=e.target.closest('[data-show]');
  if(sh){const grp=sh.dataset.group;frame.querySelectorAll(`[data-pane-g="${grp}"]`).forEach(p=>{p.hidden=p.id!==sh.dataset.show;});frame.querySelectorAll(`[data-show][data-group="${grp}"]`).forEach(b=>b.classList.toggle('on',b===sh));return;}
  const g=e.target.closest('[data-go]');
  if(g){if(cur==='B1')ORD_DATA=readOrder();pendingTab=g.dataset.tab||null;nav(g.dataset.go);}
  if(e.target.classList&&e.target.classList.contains('modal'))e.target.hidden=true;
});
document.addEventListener('change',e=>{
  const sl=e.target;
  if(sl.matches&&sl.matches('select[data-add]')&&sl.value){
    const k=sl.dataset.add,list=frame.querySelector(`[data-list="${k}"]`);
    if(list&&![...list.children].some(r=>r.dataset.name===sl.value)){list.insertAdjacentHTML('beforeend',orow(k,sl.value,''));const i=list.lastElementChild.querySelector('input');if(i)i.focus();}
    sl.value='';}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Tab'&&e.target.matches&&e.target.matches('.gt')){
    const ta=e.target,sug=ta.dataset.sug;
    if(ta.value!==sug&&sug.startsWith(ta.value)){e.preventDefault();ta.value=sug;ghostSync(ta);return;}
  }
  if(e.key==='Escape'){frame.querySelectorAll('.modal').forEach(m=>m.hidden=true);}
  if(e.target.matches&&e.target.matches('input,textarea,select'))return;
  const i=ORDER.indexOf(cur);
  if(e.key==='ArrowRight'&&i<ORDER.length-1)nav(ORDER[i+1]);
  if(e.key==='ArrowLeft'&&i>0)nav(ORDER[i-1]);
  if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('#frame [data-go]')&&e.target.tagName!=='BUTTON'){e.preventDefault();const g=e.target.closest('[data-go]');pendingTab=g.dataset.tab||null;nav(g.dataset.go);}
});
buildIndex();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
show(location.hash.slice(1)||'W1');

</script>
</body>
</html>
